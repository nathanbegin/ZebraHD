name: Android APK

on:
  pull_request:
    paths: ["mobile.html", "app/**", "manifest.webmanifest", "logo.png", "icon-*.png", ".github/workflows/android-apk.yml"]
  push:
    branches: [mobile]
    paths: ["mobile.html", "app/**", "manifest.webmanifest", "logo.png", "icon-*.png", ".github/workflows/android-apk.yml"]
  workflow_dispatch:

permissions:
  contents: write   # nécessaire pour publier l'APK dans une Release (branche mobile)

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      # Le SDK Android est déjà présent sur les runners GitHub : on installe seulement la plateforme et les outils requis.
      - name: SDK Android (API 36)
        run: |
          SDKM=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0"
      - run: npm ci
      - run: npm run sync
      - name: Compiler l'APK
        run: ./gradlew assembleDebug --no-daemon
        working-directory: app/android
      - name: Nommer l'APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk ZebraHD-mobile-debug.apk
      - name: Lire la version (version.json)
        id: ver
        run: echo "version=$(jq -r .version ../version.json)" >> "$GITHUB_OUTPUT"
      - name: Vérifier la version de l'APK
        run: |
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          FOUND=$("$AAPT" dump badging ZebraHD-mobile-debug.apk | grep -o "versionName='[^']*'" | head -1)
          echo "APK : $FOUND — attendu : versionName='${{ steps.ver.outputs.version }}'"
          test "$FOUND" = "versionName='${{ steps.ver.outputs.version }}'"
      - uses: actions/upload-artifact@v4
        with:
          name: ZebraHD-mobile-debug-apk
          path: app/ZebraHD-mobile-debug.apk
      # Sur la branche mobile : APK téléchargeable depuis la page « Releases » du dépôt.
      - name: Publier dans une Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/mobile'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mobile-latest
          name: Application Android (APK) v${{ steps.ver.outputs.version }}
          body: "Version ${{ steps.ver.outputs.version }} — APK de débogage construit automatiquement depuis la branche `mobile` (commit ${{ github.sha }}). La version installée s'affiche dans l'application : onglet Imprimante > À propos. Installer : télécharger le fichier .apk, autoriser les sources inconnues, ouvrir."
          prerelease: true
          files: app/ZebraHD-mobile-debug.apk
